[project]
name = "drawingwithgaussians"
version = "0.1.0"
description = "Experimental MLX Gaussian splatting/image fitting"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Gleb", email = "sterkin.gleb@gmail.com" }]
dependencies = [
  "numpy>=1.26.4,<2.0.0",
  "pillow>=10.2.0,<11.0.0",
  "opencv-python>=4.9.0.80,<5.0.0.0",
  "hydra-core>=1.3.2,<2.0.0",
  "mlx>=0.31.2,<0.32.0",
  "scipy>=1.17.1",
  "pycolmap>=4.1.0",
  "plyfile>=1.1.3",
]

[dependency-groups]
dev = ["pre-commit>=3.6.2,<4.0.0", "pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drawingwithgaussians"]
