data:
  dir: "${hydra:runtime.cwd}/inputs/flowers"
  factor: 8
  max_side: 1024 # resize the longer side after loading; null keeps dataset image size
  test_every: 8 # every Nth COLMAP image is held out of training
  normalize: true # center/scale cameras and sparse points before training

gaussians:
  mode: "2dgs" # 3dgs | 2dgs
  max_init_points: 20000 # random sparse COLMAP points used for initialization
  init_opacity: 0.1
  init_scale: 0.1 # fallback/constant initial 3D scale
  init_scale_mode: "knn" # knn | constant
  init_knn_k: 3
  init_scale_mult: 0.5
  init_scale_min: 1e-4
  init_scale_max: 0.05 # null/<=0 disables the upper clip in KNN init
  sh_degree: 3 # allocate all degree-3 coefficients; activate progressively
  sh_interval: 1000 # active degree = min(global_step // interval, sh_degree)
  grad_thr: 1e-04 # Stage 3b: tuned for the 2K-init normalized densification default
  split_iters: [500, 600, 700, 800, 900, 1000] # later refinements regress Flowers quality (Exp 24)
  grow_scale: 0.01 # fraction of scene_scale; smaller grad-high gaussians duplicate, larger split
  prune_opa: 0.05
  prune_scale3d: 0.1 # fraction of scene_scale; <=0 disables scale pruning
  reset_opacity_every: 2 # split boundaries; 0 disables
  carry_optimizer_state: true # fresh Adam state each refine (see EXPERIMENTS.md)
  selective_adam: true # fused Metal Adam; inactive tile rows and their state stay frozen
  utilization_telemetry: true # normalized activated-opacity net-gradient proxy
  utilization_pruning: false # enable only after freezing a threshold on the tuning seed
  utilization_ema_decay: 0.95
  utilization_threshold: 0.0 # must be tuned/frozen before utilization_pruning=true
  utilization_warmup: 1000
  utilization_min_observations: 100
  utilization_grace: 500
  utilization_low_windows: 3
  bin_capacity: auto # auto | exact | integer per Gaussian; recomputed each segment
  bin_capacity_min: 0 # top-B sizing makes a per-Gaussian floor unnecessary
  bin_capacity_margin: 1.0
  bin_overflow_margin: 1.25
  bin_capacity_stat: topb # mean | p95 | topb | worst; topb is safe without-replacement batch sizing
  bin_check_overflow: retry # retry rolls back a truncated step; preflight is validation-only
  bin_strategy: tile_local # tile_local evaluates the exact predicate once and sorts actual members per tile
  bin_tile_capacity: 512 # 256 | 512 | 1024 | 2048; retry grows the bucket on occupancy overflow
  bin_tile_memory_mb: 128 # segment falls back to compact global bins above this preallocation budget
  # --- DashGaussian scheduling (arXiv:2503.18402); defaults preserve behavior ---
  resolution_mode: freq # const | freq. freq = frequency-guided coarse-to-fine render resolution (multi-view spectrum).
  start_significance_factor: 4.0 # 'a' in the paper: coarsest window keeps 1/a of spectral energy (larger = lower start res).
  increase_reso_frac: 0.3 # ramp resolution to full over the first this-fraction of total steps (decoupled from split window).
  densify_mode: budget # free | budget. budget = momentum count budget + top-k densification (replaces grad_thr as capacity knob).
  max_n_gaussian: -1 # >0 pins a fixed budget (momentum off); -1 = momentum-estimated P_fin.
  budget_gamma: 0.98 # momentum integrate factor for P_fin (Eq. 5).
  budget_eta: 1.0 # momentum force factor for the realized densification count (Eq. 5).
  max_densify_rate_per_step: 0.2 # per-refine growth cap as a fraction of surviving gaussians.
  budget_grad_percentile: 50.0 # budget-mode relative gate: keep candidates above this percentile of the refine signal.
  lr_decay_from_full_res: false # DashGaussian LR delay: hold means LR until first full-res step (needs global_schedule + means_mode != const).

optim:
  seed: 1
  # Per-group LRs (gsplat COLMAP trainer values). A scalar is still accepted
  # (single Adam over all groups, the fit3d/image_fitting behavior). To run the
  # L0 identity baseline, override every group to the same value.
  lr:
    means: 1.6e-4 # multiplied by scene_scale at runtime (see means_lr_scene_scale)
    scales: 5e-3
    quats: 1e-3
    opacities: 5e-2
    sh0: 2.5e-3
    shN: 1.25e-4
  means_lr_scene_scale: true # L2: scale the means LR by scene_scale
  means_only_schedule: true # L3: means_mode schedule applies to the means group only
  global_schedule: false # L4a: schedule spans the whole run; false => per-split restart (SGDR, EXPERIMENTS Exp 8)
  photometric_correction: false # optional per-camera affine gain/bias after SH
  photometric_lr: 1e-3
  photometric_regularizer: 1e-3 # identity prior on log-gain and bias
  num_steps: 4000 # total optimizer steps for the whole run (preserves the former 20 x 500 schedule)
  means_mode: "const" # const | cos | cos_restart | exp (exp/global_schedule are L4b, off by default)
  loss:
    ssim_weight: 0.2
    lpips_weight: 0.0 # zero skips model creation and all per-step LPIPS work
    normal_weight: 0.05 #0.05 # 2dgs reference normal consistency weight
    distortion_weight: 0.01 #0.01 # Mip-NeRF-360/2DGS L1 distortion weight
    normal_start_frac: 0.233 # activate at first split boundary >= 23.3% of total steps
    distortion_start_frac: 0.1 # activate at first split boundary >= 10% of total steps
    normal_depth_mode: "expected" # expected | median

train:
  camera_batch: 4 # cameras rendered per optimizer step in one batched kernel launch
  view_sampling: shuffle # random | shuffle
  log_frequency: 50
  eval_every: 500 # eval on the val split every N optimizer steps (0 disables intermediate evals)
  eval_count_batch_size: 8 # val views per chunk in the eval capacity count pass
  eval_save_renders: false # dump val renders as val_{view}_step{step}.png under out_dir/val/
  eval_lpips: true # native MLX LPIPS-Alex; disable for speed runs
  save_video: true
  save_depth: true # when save_video is true, save depth|rgb|target panels instead of rgb|target
  save_dtu_renders: false # export train-view median depth/alpha/RGB/intrinsics for evaluate_dtu.py
  dtu_render_max_side: null # null = native 1600x1200 DTU fusion renders, independent of training max_side
  video_every: 50
  video_index: 0 # train-split image index used as the fixed preview viewpoint
